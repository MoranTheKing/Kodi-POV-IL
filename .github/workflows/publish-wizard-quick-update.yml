name: Publish Wizard and Quick Update

# Builds the wizard ZIP, the Quick Update ZIP, and a refreshed full build ZIP
# from the current source tree. The Quick Update now includes the build-edition
# AI subtitles addon so existing build users receive critical AI subtitle fixes,
# while the clean standalone AI package is still built only by publish-ai-subtitles.

on:
  workflow_dispatch:
    inputs:
      wizard_version:
        description: 'Wizard addon version'
        required: true
        default: '0.1.17'
      quickfix_version:
        description: 'Quick Update / gui zip version'
        required: true
        default: '0.1.135'
      build_version:
        description: 'Full build version'
        required: true
        default: '0.1.29'
      previous_build_version:
        description: 'Existing full build zip to refresh'
        required: true
        default: '0.1.28'
      ai_addon_version:
        description: 'Build-edition AI subtitles addon version to include'
        required: true
        default: '0.2.137'
      quick_update_note_id:
        description: 'Quick Update notification id. Must increase to notify existing users again.'
        required: true
        default: '192'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-wizard-quick-update.yml'
      - 'wizard/source/plugin.program.kodipovilwizard/**'
      - 'addons/service.subtitles.kodipovilai/**'
      - 'dist/service.subtitles.kodipovilai-build-*.zip'

permissions:
  contents: write

env:
  BUILD_NAME: 'Kodi POV IL - FENtastic'
  BUILD_SLUG: 'Kodi-POV-IL-FENtastic'
  WIZARD_ID: 'plugin.program.kodipovilwizard'
  AI_ADDON_ID: 'service.subtitles.kodipovilai'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            src

      - name: Resolve versions
        working-directory: src
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WIZARD_VERSION="${{ github.event.inputs.wizard_version }}"
            QUICKFIX_VERSION="${{ github.event.inputs.quickfix_version }}"
            BUILD_VERSION="${{ github.event.inputs.build_version }}"
            PREVIOUS_BUILD_VERSION="${{ github.event.inputs.previous_build_version }}"
            AI_ADDON_VERSION="${{ github.event.inputs.ai_addon_version }}"
            QUICK_UPDATE_NOTE_ID="${{ github.event.inputs.quick_update_note_id }}"
          else
            WIZARD_VERSION="0.1.17"
            QUICKFIX_VERSION="0.1.135"
            BUILD_VERSION="0.1.29"
            PREVIOUS_BUILD_VERSION="0.1.28"
            AI_ADDON_VERSION="0.2.137"
            QUICK_UPDATE_NOTE_ID="192"
          fi
          echo "WIZARD_VERSION=$WIZARD_VERSION" >> "$GITHUB_ENV"
          echo "QUICKFIX_VERSION=$QUICKFIX_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_BUILD_VERSION=$PREVIOUS_BUILD_VERSION" >> "$GITHUB_ENV"
          echo "AI_ADDON_VERSION=$AI_ADDON_VERSION" >> "$GITHUB_ENV"
          echo "QUICK_UPDATE_NOTE_ID=$QUICK_UPDATE_NOTE_ID" >> "$GITHUB_ENV"
          echo "Wizard:   $WIZARD_VERSION"
          echo "Quickfix: $QUICKFIX_VERSION"
          echo "Build:    $BUILD_VERSION (from $PREVIOUS_BUILD_VERSION)"
          echo "AI addon: $AI_ADDON_VERSION (build edition)"
          echo "Quick update note id: $QUICK_UPDATE_NOTE_ID"

      - name: Patch source version pointers before packaging
        working-directory: src
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          wizard_version = os.environ['WIZARD_VERSION']
          build_version = os.environ['BUILD_VERSION']

          addon_xml = Path('wizard/source/plugin.program.kodipovilwizard/addon.xml')
          text = addon_xml.read_text(encoding='utf-8-sig')
          text = re.sub(
              r'(<addon\s+id="plugin\.program\.kodipovilwizard"\s+name="[^"]+"\s+version=")([^"]+)(")',
              rf'\g<1>{wizard_version}\3',
              text,
              count=1,
          )
          addon_xml.write_text(text, encoding='utf-8')

          uservar = Path('wizard/source/plugin.program.kodipovilwizard/uservar.py')
          text = uservar.read_text(encoding='utf-8-sig')
          text = re.sub(
              r"BUILDVERSION_DEFAULT = '[^']+'",
              f"BUILDVERSION_DEFAULT = '{build_version}'",
              text,
              count=1,
          )
          uservar.write_text(text, encoding='utf-8')
          PY

      - name: Build wizard ZIP
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip"
          (cd wizard/source && zip -qr "../../dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" "${WIZARD_ID}")
          unzip -t "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" >/dev/null
          ls -lh "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip"

      - name: Build Quick Update ZIP with build-edition AI addon
        working-directory: src
        run: |
          set -euo pipefail
          AI_BUILD_ZIP="dist/${AI_ADDON_ID}-build-${AI_ADDON_VERSION}.zip"
          if [ ! -f "$AI_BUILD_ZIP" ]; then
            echo "::error::Build-edition AI addon ZIP not found: $AI_BUILD_ZIP"
            exit 1
          fi

          WORK="$RUNNER_TEMP/quickfix"
          rm -rf "$WORK"
          mkdir -p "$WORK/addons"
          cp -a "wizard/source/${WIZARD_ID}" "$WORK/addons/${WIZARD_ID}"
          unzip -q "$AI_BUILD_ZIP" -d "$WORK/addons"

          if [ ! -f "$WORK/addons/${AI_ADDON_ID}/resources/lib/darksubs_none_guard_patcher.py" ]; then
            echo "::error::AI None guard patcher missing from Quick Update package"
            exit 1
          fi
          if ! grep -q "version=\"${AI_ADDON_VERSION}\"" "$WORK/addons/${AI_ADDON_ID}/addon.xml"; then
            echo "::error::Quick Update AI addon version is not ${AI_ADDON_VERSION}"
            exit 1
          fi

          OUT="dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip"
          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$OLDPWD/$OUT" addons)
          unzip -t "$OUT" >/dev/null
          unzip -l "$OUT" | grep "addons/${WIZARD_ID}/addon.xml"
          unzip -l "$OUT" | grep "addons/${AI_ADDON_ID}/resources/lib/darksubs_none_guard_patcher.py"
          ls -lh "$OUT"

      - name: Build refreshed full build ZIP
        working-directory: src
        run: |
          set -euo pipefail
          OLD="dist/${BUILD_SLUG}-test-${PREVIOUS_BUILD_VERSION}.zip"
          NEW="dist/${BUILD_SLUG}-test-${BUILD_VERSION}.zip"
          AI_BUILD_ZIP="dist/${AI_ADDON_ID}-build-${AI_ADDON_VERSION}.zip"
          if [ ! -f "$OLD" ]; then
            echo "::error::Base full build ZIP not found: $OLD"
            exit 1
          fi
          if [ ! -f "$AI_BUILD_ZIP" ]; then
            echo "::error::Build-edition AI addon ZIP not found: $AI_BUILD_ZIP"
            exit 1
          fi
          WORK="$RUNNER_TEMP/full-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$OLD" -d "$WORK"
          rm -rf "$WORK/addons/${WIZARD_ID}"
          rm -rf "$WORK/addons/${AI_ADDON_ID}"
          mkdir -p "$WORK/addons"
          cp -a "wizard/source/${WIZARD_ID}" "$WORK/addons/${WIZARD_ID}"
          unzip -q "$AI_BUILD_ZIP" -d "$WORK/addons"
          if [ ! -f "$WORK/addons/${AI_ADDON_ID}/resources/lib/darksubs_none_guard_patcher.py" ]; then
            echo "::error::AI None guard patcher missing from full build package"
            exit 1
          fi
          rm -f "$NEW"
          (cd "$WORK" && zip -qr "$OLDPWD/$NEW" .)
          unzip -t "$NEW" >/dev/null
          ls -lh "$NEW"

      - name: Update build.txt and Quick Update notice
        working-directory: src
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          wizard = os.environ['WIZARD_VERSION']
          quickfix = os.environ['QUICKFIX_VERSION']
          build = os.environ['BUILD_VERSION']
          ai = os.environ['AI_ADDON_VERSION']
          base = 'https://github.com/MoranTheKing/Kodi-POV-IL/raw/main/dist'

          build_txt = Path('wizard/assets/build.txt')
          text = build_txt.read_text(encoding='utf-8-sig')
          text = re.sub(
              r'id="plugin\.program\.kodipovilwizard"\nversion="[^"]+"\nzip="[^"]+"',
              f'id="plugin.program.kodipovilwizard"\nversion="{wizard}"\nzip="{base}/plugin.program.kodipovilwizard-{wizard}.zip"',
              text,
              count=1,
          )
          text = re.sub(
              r'(name="Kodi POV IL - FENtastic"\nversion=")[^"]+("\nurl=")[^"]+("\nminor="https://"\ngui=")[^"]+("\nkodi=)',
              rf'\g<1>{build}\g<2>{base}/Kodi-POV-IL-FENtastic-test-{build}.zip\g<3>{base}/Kodi-POV-IL-FENtastic-quickfix-{quickfix}.zip\g<4>',
              text,
              count=1,
          )
          build_txt.write_text(text, encoding='utf-8')
          print(f'AI addon included in quick update: {ai}')
          PY

          cat > wizard/assets/notification_files/quick_update.txt <<EOF
          ${QUICK_UPDATE_NOTE_ID}
          |||
          תיקון עדכוני אפליקציה + החלפת סקין + כתוביות AI

          למשתמשים על Kodi 21.2: הודעת עדכון האפליקציה כבר לא תציג שדה Downloader ריק. אם אין קוד Downloader קצר, יוצג קישור דף ההורדות במקום.

          כפתור "החלף סקין" עודכן כך שהחלפת הסקין מתבצעת דרך Kodi JSON-RPC במקום עריכה ידנית של guisettings.xml.

          נוסף גם תיקון לתרגום כתוביות AI דרך DarkSubs: אם DarkSubs מעביר נתיב כתוביות חסר/None, התוסף כבר לא קורס עם NoneType object has no attribute encode.

          העדכון המהיר כולל את גרסת ה-build של תוסף כתוביות AI בלבד. התוסף העצמאי/הנקי ממשיך להיבנות בנפרד ולא מקבל קבצי Wizard/Build.

          quickfix ${QUICKFIX_VERSION} + build ${BUILD_VERSION} + wizard ${WIZARD_VERSION} + AI ${AI_ADDON_VERSION}
          EOF

      - name: Sanity check package contents
        working-directory: src
        run: |
          set -euo pipefail
          grep -n "version=\"${WIZARD_VERSION}\"" wizard/source/plugin.program.kodipovilwizard/addon.xml
          grep -n "BUILDVERSION_DEFAULT = '${BUILD_VERSION}'" wizard/source/plugin.program.kodipovilwizard/uservar.py
          grep -n "${WIZARD_VERSION}\|${QUICKFIX_VERSION}\|${BUILD_VERSION}" wizard/assets/build.txt
          grep -n "${QUICK_UPDATE_NOTE_ID}" wizard/assets/notification_files/quick_update.txt
          unzip -l "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" | grep "addons/${WIZARD_ID}/uservar.py"
          unzip -l "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" | grep "addons/${AI_ADDON_ID}/addon.xml"
          unzip -l "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" | grep "addons/${AI_ADDON_ID}/resources/lib/darksubs_none_guard_patcher.py"

      - name: Commit release artifacts
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" \
            "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" \
            "dist/${BUILD_SLUG}-test-${BUILD_VERSION}.zip" \
            wizard/assets/build.txt \
            wizard/assets/notification_files/quick_update.txt \
            wizard/source/plugin.program.kodipovilwizard/addon.xml \
            wizard/source/plugin.program.kodipovilwizard/uservar.py
          if git diff --cached --quiet; then
            echo "No release artifact changes to commit."
            exit 0
          fi
          git commit -m "Publish wizard quick update ${QUICKFIX_VERSION}"
          git push origin HEAD:main
