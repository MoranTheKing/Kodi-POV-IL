name: Publish Wizard and Quick Update

# Builds the wizard ZIP, the Quick Update ZIP, and a refreshed full build ZIP
# from the current source tree. It intentionally packages only the wizard/build
# payload and does not include or modify service.subtitles.kodipovilai.

on:
  workflow_dispatch:
    inputs:
      wizard_version:
        description: 'Wizard addon version'
        required: true
        default: '0.1.17'
      quickfix_version:
        description: 'Quick Update / gui zip version'
        required: true
        default: '0.1.133'
      build_version:
        description: 'Full build version'
        required: true
        default: '0.1.28'
      previous_build_version:
        description: 'Existing full build zip to refresh'
        required: true
        default: '0.1.27'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-wizard-quick-update.yml'
      - 'wizard/source/plugin.program.kodipovilwizard/**'

permissions:
  contents: write

env:
  BUILD_NAME: 'Kodi POV IL - FENtastic'
  BUILD_SLUG: 'Kodi-POV-IL-FENtastic'
  WIZARD_ID: 'plugin.program.kodipovilwizard'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            src

      - name: Resolve versions
        working-directory: src
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WIZARD_VERSION="${{ github.event.inputs.wizard_version }}"
            QUICKFIX_VERSION="${{ github.event.inputs.quickfix_version }}"
            BUILD_VERSION="${{ github.event.inputs.build_version }}"
            PREVIOUS_BUILD_VERSION="${{ github.event.inputs.previous_build_version }}"
          else
            WIZARD_VERSION="0.1.17"
            QUICKFIX_VERSION="0.1.133"
            BUILD_VERSION="0.1.28"
            PREVIOUS_BUILD_VERSION="0.1.27"
          fi
          echo "WIZARD_VERSION=$WIZARD_VERSION" >> "$GITHUB_ENV"
          echo "QUICKFIX_VERSION=$QUICKFIX_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_BUILD_VERSION=$PREVIOUS_BUILD_VERSION" >> "$GITHUB_ENV"
          echo "Wizard:   $WIZARD_VERSION"
          echo "Quickfix: $QUICKFIX_VERSION"
          echo "Build:    $BUILD_VERSION (from $PREVIOUS_BUILD_VERSION)"

      - name: Patch source version pointers before packaging
        working-directory: src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          wizard_version = os.environ['WIZARD_VERSION']
          build_version = os.environ['BUILD_VERSION']
          addon_xml = Path('wizard/source/plugin.program.kodipovilwizard/addon.xml')
          text = addon_xml.read_text(encoding='utf-8-sig')
          import re
          text = re.sub(r'(<addon\s+id="plugin\.program\.kodipovilwizard"\s+name="[^"]+"\s+version=")([^"]+)(")',
                        rf'\g<1>{wizard_version}\3', text, count=1)
          addon_xml.write_text(text, encoding='utf-8')

          uservar = Path('wizard/source/plugin.program.kodipovilwizard/uservar.py')
          text = uservar.read_text(encoding='utf-8-sig')
          text = re.sub(r"BUILDVERSION_DEFAULT = '[^']+'", f"BUILDVERSION_DEFAULT = '{build_version}'", text, count=1)
          uservar.write_text(text, encoding='utf-8')
          PY

      - name: Build wizard ZIP
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip"
          (cd wizard/source && zip -qr "../../dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" "${WIZARD_ID}")
          unzip -t "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" >/dev/null
          ls -lh "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip"

      - name: Build Quick Update ZIP without AI addon
        working-directory: src
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/quickfix"
          rm -rf "$WORK"
          mkdir -p "$WORK/addons"
          cp -a "wizard/source/${WIZARD_ID}" "$WORK/addons/${WIZARD_ID}"
          if find "$WORK" -path '*service.subtitles.kodipovilai*' | grep -q .; then
            echo "::error::AI addon leaked into Quick Update package"
            exit 1
          fi
          OUT="dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip"
          rm -f "$OUT"
          (cd "$WORK" && zip -qr "$OLDPWD/$OUT" addons)
          unzip -t "$OUT" >/dev/null
          if unzip -l "$OUT" | grep -q 'service.subtitles.kodipovilai'; then
            echo "::error::AI addon found in Quick Update zip"
            exit 1
          fi
          ls -lh "$OUT"

      - name: Build refreshed full build ZIP
        working-directory: src
        run: |
          set -euo pipefail
          OLD="dist/${BUILD_SLUG}-test-${PREVIOUS_BUILD_VERSION}.zip"
          NEW="dist/${BUILD_SLUG}-test-${BUILD_VERSION}.zip"
          if [ ! -f "$OLD" ]; then
            echo "::error::Base full build ZIP not found: $OLD"
            exit 1
          fi
          WORK="$RUNNER_TEMP/full-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$OLD" -d "$WORK"
          rm -rf "$WORK/addons/${WIZARD_ID}"
          mkdir -p "$WORK/addons"
          cp -a "wizard/source/${WIZARD_ID}" "$WORK/addons/${WIZARD_ID}"
          rm -f "$NEW"
          (cd "$WORK" && zip -qr "$OLDPWD/$NEW" .)
          unzip -t "$NEW" >/dev/null
          ls -lh "$NEW"

      - name: Update build.txt and Quick Update notice
        working-directory: src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          wizard = os.environ['WIZARD_VERSION']
          quickfix = os.environ['QUICKFIX_VERSION']
          build = os.environ['BUILD_VERSION']
          base = 'https://github.com/MoranTheKing/Kodi-POV-IL/raw/main/dist'
          build_txt = Path('wizard/assets/build.txt')
          text = build_txt.read_text(encoding='utf-8-sig')
          import re
          text = re.sub(r'id="plugin\.program\.kodipovilwizard"\nversion="[^"]+"\nzip="[^"]+"',
                        f'id="plugin.program.kodipovilwizard"\nversion="{wizard}"\nzip="{base}/plugin.program.kodipovilwizard-{wizard}.zip"',
                        text, count=1)
          text = re.sub(r'(name="Kodi POV IL - FENtastic"\nversion=")[^"]+("\nurl=")[^"]+("\nminor="https://"\ngui=")[^"]+("\nkodi=)',
                        rf'\g<1>{build}\g<2>{base}/Kodi-POV-IL-FENtastic-test-{build}.zip\g<3>{base}/Kodi-POV-IL-FENtastic-quickfix-{quickfix}.zip\g<4>',
                        text, count=1)
          build_txt.write_text(text, encoding='utf-8')

          notice = Path('wizard/assets/notification_files/quick_update.txt')
          notice.write_text(f'''190
|||
תיקון החלפת סקין ועדכון Wizard

כפתור "החלף סקין" עודכן כך שהחלפת הסקין מתבצעת דרך Kodi JSON-RPC במקום עריכה ידנית של guisettings.xml.

לאחר הבחירה, המערכת מוודאת ש-Kodi באמת קיבל את הסקין החדש לפני סגירה והפעלה מחדש.

התוסף העצמאי של כתוביות AI נשאר נקי משינויים של בילד, סקינים ואריחים.

quickfix {quickfix} + build {build} + wizard {wizard}
''', encoding='utf-8')
          PY

      - name: Sanity check package contents
        working-directory: src
        run: |
          set -euo pipefail
          grep -n "version=\"${WIZARD_VERSION}\"" wizard/source/plugin.program.kodipovilwizard/addon.xml
          grep -n "BUILDVERSION_DEFAULT = '${BUILD_VERSION}'" wizard/source/plugin.program.kodipovilwizard/uservar.py
          grep -n "${WIZARD_VERSION}\|${QUICKFIX_VERSION}\|${BUILD_VERSION}" wizard/assets/build.txt
          if unzip -l "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" | grep -q 'service.subtitles.kodipovilai'; then
            echo "::error::AI addon found in Quick Update zip"
            exit 1
          fi
          if git diff --name-only | grep -q '^addons/service.subtitles.kodipovilai/'; then
            echo "::error::AI addon source changed unexpectedly"
            exit 1
          fi

      - name: Commit generated release files
        working-directory: src
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add \
            "dist/${WIZARD_ID}-${WIZARD_VERSION}.zip" \
            "dist/${BUILD_SLUG}-quickfix-${QUICKFIX_VERSION}.zip" \
            "dist/${BUILD_SLUG}-test-${BUILD_VERSION}.zip" \
            wizard/assets/build.txt \
            wizard/assets/notification_files/quick_update.txt \
            wizard/source/plugin.program.kodipovilwizard/addon.xml \
            wizard/source/plugin.program.kodipovilwizard/uservar.py
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish wizard ${WIZARD_VERSION} and quickfix ${QUICKFIX_VERSION} [skip ci]"
          git push origin main
