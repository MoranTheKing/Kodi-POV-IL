name: Generate signing keystore

# One-time workflow that creates an Android release keystore on the
# runner, encrypts it with KEYSTORE_PASSWORD, and opens a PR that adds
# it to the repo as `release.keystore.enc`. The unencrypted keystore
# never leaves the runner; only the encrypted blob lands in git.
#
# Run order: add the KEYSTORE_PASSWORD secret first, then trigger this
# workflow once, merge the resulting PR. After that the main APK build
# workflow can decrypt and use the keystore on every run.

on:
  workflow_dispatch:
    inputs:
      validity_days:
        description: 'Keystore validity in days (10000 = ~27 years, recommended)'
        required: true
        default: '10000'
      dname:
        description: 'Certificate distinguished name'
        required: true
        default: 'CN=Kodi POV IL, O=MoranTheKing, C=IL'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Install JDK
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless openssl

      - name: Verify KEYSTORE_PASSWORD secret is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set. Add it in Settings → Secrets and variables → Actions before running this workflow."
            exit 1
          fi
          # Tell GitHub to mask the password if it ever shows up in logs
          echo "::add-mask::$KEYSTORE_PASSWORD"
          if [ "${#KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::warning::KEYSTORE_PASSWORD is shorter than 12 characters. The keystore lives in the public repo encrypted with this password; a short password makes it brute-forceable. Strongly recommend re-running with a longer password."
          fi

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kodipovil \
            -keyalg RSA -keysize 2048 \
            -validity "${{ github.event.inputs.validity_days }}" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass  "$KEYSTORE_PASSWORD" \
            -dname "${{ github.event.inputs.dname }}"
          # Show fingerprint for the user's records (no secret material)
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias kodipovil -storepass "$KEYSTORE_PASSWORD" | \
            grep -E "Owner|Issuer|Valid from|SHA1|SHA256" || true

      - name: Encrypt keystore with AES-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/release.keystore" \
            -out "$RUNNER_TEMP/release.keystore.enc" \
            -pass env:KEYSTORE_PASSWORD
          ls -la "$RUNNER_TEMP/release.keystore.enc"

      - name: Open PR with encrypted keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Clone main fresh so we don't accidentally bring along anything
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="bot/add-encrypted-keystore-$(date +%s)"
          git checkout -b "$BRANCH"
          mkdir -p .secrets
          cp "$RUNNER_TEMP/release.keystore.enc" .secrets/release.keystore.enc
          # Make sure this is the ONLY thing in the PR
          git add .secrets/release.keystore.enc
          COMMIT_MSG=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n%s' \
            "Add encrypted release keystore" \
            "Generated by .github/workflows/setup-keystore.yml." \
            "Encrypted with AES-256-CBC + PBKDF2 (200k iterations) using the" \
            "KEYSTORE_PASSWORD secret. Unencrypted keystore never left the runner." \
            "The build-apk workflow decrypts this at build time and uses it to" \
            "sign the APK + verify the certificate.")
          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"
          PR_BODY=$(printf '%s\n\n%s\n\n%s' \
            "Auto-generated by the setup-keystore workflow (run ${{ github.run_id }})." \
            "After merging, the main build-apk workflow can sign APKs using the keystore encrypted at \`.secrets/release.keystore.enc\` together with the \`KEYSTORE_PASSWORD\` secret." \
            "You only need to run setup-keystore.yml once. If you ever lose access to KEYSTORE_PASSWORD, delete \`.secrets/release.keystore.enc\` and rerun setup-keystore.yml with a new password (users with the old APK will need to uninstall before installing the new one).")
          gh pr create --base main --head "$BRANCH" \
            --title "Add encrypted release keystore" \
            --body "$PR_BODY"
