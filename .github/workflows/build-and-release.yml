name: Build addon zips and release

# Runs only after the modular branch is merged into the existing public repo.
#
# What it does:
#   1. Detects which addon folder(s) changed in the push (or all, on a
#      manual / seed run).
#   2. Packages each changed addon into a valid, deterministic Kodi zip
#      (<id>-<version>.zip).
#   3. Publishes versioned assets without deleting previous versions.
#   4. Verifies remote assets before switching manifest.json.

on:
  push:
    branches: [main]
    # Trigger only when an actual addon folder changes. Kodi addon ids are
    # always prefixed by their kind, so these globs cover all 8 addons (and
    # any future one) while ignoring manifest.json, README, .github, etc.
    paths:
      - "plugin.*/**"
      - "repository.*/**"
      - "script.*/**"
      - "service.*/**"
      - "skin.*/**"
      - "userdata/**"
      - ".github/pov-host-migration.json"
      - ".github/umbrella-pin.json"
      - ".github/workflows/build-and-release.yml"
      - "tests/test_search_provider_skins.py"
  workflow_dispatch: {}

permissions:
  contents: write

# Never run two releases at once: they share one rolling release + manifest.
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  RELEASE_TAG: addons-latest
  REPO: MoranTheKing/Kodi-POV-IL
  GH_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    if: github.repository == 'MoranTheKing/Kodi-POV-IL'
    # (pinned: "ubuntu-latest" began to move to Ubuntu 26 in Oct 2026, whose Python 3.14 is not the
    # Python the build is tested on; the move is made on purpose, after the suite passes there)
    runs-on: ubuntu-24.04
    steps:
      # This repository allows only owner-authored Actions. The runner already
      # includes Git, Python 3 and gh, so no third-party Action is necessary.
      - name: Checkout source and prepare Python
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" .
          git checkout --detach "$GITHUB_SHA"
          command -v python3
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$(command -v python3)" "$RUNNER_TEMP/bin/python"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          gh auth setup-git

      - name: Carry verified community-pool credential from the shipped MoranSubs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, re, zipfile
          # The standalone MoranSubs the repository keeps carries the key block every release has shipped
          # (it came from the old build's last quickfix, removed from GitHub on 21 Nov 2026). The block
          # itself is pinned, so the carrier may change with every standalone release.
          archive = Path('dist/service.subtitles.kodipovilai-latest.zip')
          expected = 'f7ab7e44ef909edd2abb5106f35b5249918ea4093ccada9c21b3e9f0ac2157dc'
          if not archive.is_file():
              raise SystemExit('the shipped MoranSubs package is missing')
          with zipfile.ZipFile(archive) as package:
              if package.testzip():
                  raise SystemExit('the shipped MoranSubs package failed CRC')
              payload = package.read('service.subtitles.kodipovilai/resources/lib/pool.py')
          blocks = re.findall(rb'__POOL_KEY_BEGIN__.*?__POOL_KEY_END__', payload, re.S)
          if len(blocks) != 1 or hashlib.sha256(blocks[0]).hexdigest() != expected:
              raise SystemExit('the shipped pool credential is missing or changed')
          target = Path(os.environ['RUNNER_TEMP']) / 'povil-pool-credential.py'
          target.write_bytes(payload)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('POVIL_POOL_CARRY_FILE=' + str(target) + '\n')
          print('Verified previous pool credential for modular packaging')
          PY

      - name: Start with an empty packaging directory
        run: |
          # The existing public repository tracks historical archives in
          # dist/. They are not modular release inputs. A fresh CI checkout
          # must never publish or hash one as a newly built modular addon.
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path.cwd().resolve()
          target = (root / 'dist').resolve()
          if target.parent != root or target.is_symlink():
              raise SystemExit('refusing unexpected packaging directory')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir()
          PY

      - name: Verify modular migration and update rules
        run: |
          # A failure is named in an annotation of the run (readable without the log): the suite passes on the
          # developer's machine, so a failure here is about THIS machine and has to say what it was and on
          # which Python. (The output is kept outside the checkout: nothing of it reaches a commit.)
          version="$(python --version 2>&1)"
          if ! python -m pip install -q -r tests/requirements.txt 2> "$RUNNER_TEMP/pip_output.txt"; then
            echo "::error::the tests' requirements did not install on $version: $(tail -n 3 "$RUNNER_TEMP/pip_output.txt" | tr '\n' ' ' | cut -c1-400)"
            cat "$RUNNER_TEMP/pip_output.txt"
            exit 1
          fi
          out="$RUNNER_TEMP/test_output.txt"
          if ! python -m unittest discover -s tests 2> "$out"; then
            echo "::error::the tests failed on $version: $(tail -n 1 "$out")"
            grep -E '^(FAIL|ERROR): ' "$out" | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true
            grep -E '^[A-Za-z.]*(Error|Exception): ' "$out" | head -10 | while IFS= read -r line; do echo "::error::${line:0:300}"; done || true
            tail -n 120 "$out"
            exit 1
          fi
          tail -n 4 "$out"

      - name: Verify hooks against the pinned official POV before publishing
        run: python .github/scripts/verify_pov_patches.py

      - name: Verify hooks against the pinned official Umbrella before publishing
        run: python .github/scripts/verify_pov_patches.py "" .github/umbrella-pin.json

      - name: Detect changed addons
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ ! -f manifest.json ]; then
            IDS=$(python .github/scripts/list_changed.py all)
          else
            IDS=$(python .github/scripts/list_changed.py diff "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "Changed addons:"
          echo "${IDS:-<none>}"
          JOINED=$(printf '%s' "$IDS" | tr '\n' ' ' | sed -e 's/^ *//' -e 's/ *$//')
          echo "ids=$JOINED" >> "$GITHUB_OUTPUT"
          if [ -z "$JOINED" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

          # Detect a build-config (userdata/) change independently of addons.
          # Manual runs always rebuild the config; pushes rebuild it only when
          # a file under userdata/ actually changed.
          CONFIG_CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ ! -f manifest.json ]; then
            CONFIG_CHANGED=true
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
                 | grep -qE '^userdata/'; then
            CONFIG_CHANGED=true
          elif ! python -c 'import json,sys; m=json.load(open("manifest.json", encoding="utf-8")).get("config") or {}; p=json.load(open("userdata/config_policy.json", encoding="utf-8")); sys.exit(0 if m.get("config_version") == p.get("config_version") else 1)'; then
            # The published manifest still carries an older settings pack
            # (the run that should have moved it failed): catch up on this run.
            CONFIG_CHANGED=true
          fi
          echo "config=$CONFIG_CHANGED" >> "$GITHUB_OUTPUT"

          HOST_CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ ! -f manifest.json ]; then
            HOST_CHANGED=true
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
               | grep -qFx -e '.github/pov-host-migration.json' -e '.github/umbrella-pin.json'; then
            HOST_CHANGED=true
          elif ! python -c 'import json,sys; m=json.load(open("manifest.json", encoding="utf-8")).get("pov_host_migration") or {}; p=json.load(open(".github/pov-host-migration.json", encoding="utf-8")); sys.exit(0 if (m.get("version"), m.get("sha256")) == (p["version"], p["sha256"]) else 1)'; then
            # The published manifest still carries an older pin (e.g. the run
            # that should have moved it failed): catch up on this run.
            HOST_CHANGED=true
          elif ! python -c 'import json,sys; m=json.load(open("manifest.json", encoding="utf-8")).get("umbrella_pin") or {}; p=json.load(open(".github/umbrella-pin.json", encoding="utf-8")); sys.exit(0 if (m.get("version"), m.get("sha256")) == (p["version"], p["sha256"]) else 1)'; then
            HOST_CHANGED=true
          fi
          echo "host=$HOST_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$JOINED" != "" ] || [ "$CONFIG_CHANGED" = "true" ] || [ "$HOST_CHANGED" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build addon zips
        if: steps.detect.outputs.any == 'true'
        run: |
          set -euo pipefail
          python .github/scripts/build_addons.py ${{ steps.detect.outputs.ids }}
          # Publish a STABLE-named copy of the wizard zip for the permanent
          # install link (...-latest.zip). The versioned zip stays alongside it
          # so the manifest can still drive update detection.
          WIZ=$(ls dist/plugin.program.kodipovilwizard-*.zip 2>/dev/null \
                  | grep -vE -- '-latest\.zip$' || true)
          if [ -n "$WIZ" ]; then
            cp "$WIZ" dist/plugin.program.kodipovilwizard-latest.zip
            echo "Created stable wizard copy: plugin.program.kodipovilwizard-latest.zip"
          fi
          echo "--- dist ---"
          ls -la dist/

      - name: Build config zip
        if: steps.detect.outputs.config == 'true'
        run: |
          set -euo pipefail
          python .github/scripts/build_config.py
          echo "--- dist ---"
          ls -la dist/

      - name: Publish to rolling release
        if: steps.detect.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          # Ensure the rolling release exists.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "POV IL Addons (latest)" \
              --notes "Rolling release that always holds the current zip of every addon. Updated automatically by CI; consumed via manifest.json." \
              --latest=false \
              --target main
          fi

          # GitHub sometimes answers a read that follows a write with a
          # passing "release not found" (17 Nov 2026: the download right
          # after an upload failed the build while the release and the
          # asset were both there). A read is asked again; an upload is
          # not, since a second one would meet the first one's asset.
          again() {
            local try=0
            until "$@"; do
              try=$((try + 1))
              if [ "$try" -ge 4 ]; then return 1; fi
              echo "retry $try: $*" >&2
              sleep $((try * 10))
            done
          }

          # A versioned filename is immutable. If code changed without a
          # version bump, fail instead of silently replacing an asset that an
          # existing manifest (or rollback) already references.
          mkdir -p dist-verify
          ASSETS=$(again gh release view "$TAG" --json assets -q '.assets[].name')
          # A host-pin-only change builds no add-on zip; an unmatched glob
          # must mean "nothing to publish", not a literal 'dist/*.zip'.
          shopt -s nullglob
          for file in dist/*.zip; do
            name=$(basename "$file")
            case "$name" in *-latest.zip) continue ;; esac
            if printf '%s\n' "$ASSETS" | grep -Fxq "$name"; then
              again gh release download "$TAG" -p "$name" -D dist-verify --clobber
              if ! cmp -s "$file" "dist-verify/$name"; then
                echo "ERROR: immutable release asset $name has different bytes; bump its version" >&2
                exit 1
              fi
            else
              gh release upload "$TAG" "$file"
              again gh release download "$TAG" -p "$name" -D dist-verify --clobber
              cmp "$file" "dist-verify/$name"
            fi
          done

      - name: Regenerate manifest.json
        if: steps.detect.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # the manifest devices are reading now: its packages outlive this build
          # (see "Remove superseded packages from the release")
          cp manifest.json "$RUNNER_TEMP/manifest.previous.json"
          python .github/scripts/gen_manifest.py

      - name: Verify pinned official POV migration package
        if: steps.detect.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          entry = json.load(open('manifest.json', encoding='utf-8'))['pov_host_migration']
          with urllib.request.urlopen(entry['zip'], timeout=30) as response:
              payload = response.read(entry['size'] + 1)
          if len(payload) != entry['size'] or hashlib.sha256(payload).hexdigest() != entry['sha256']:
              raise SystemExit('official POV migration package hash/size changed')
          print('Official POV migration package verified:', entry['version'])
          entry = json.load(open('manifest.json', encoding='utf-8'))['umbrella_pin']
          with urllib.request.urlopen(entry['zip'], timeout=60) as response:
              payload = response.read(entry['size'] + 1)
          if len(payload) != entry['size'] or hashlib.sha256(payload).hexdigest() != entry['sha256']:
              raise SystemExit('official Umbrella package hash/size changed')
          print('Official Umbrella package verified:', entry['version'])
          PY

      - name: Verify every manifest target exists on release
        if: steps.detect.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          python - "$ASSETS" <<'PY'
          import json, sys
          assets = set(sys.argv[1].splitlines())
          manifest = json.load(open('manifest.json'))
          entries = list(manifest.get('addons', {}).values()) + [manifest.get('config') or {}]
          missing = [e.get('filename') for e in entries
                     if not e.get('filename') or not e.get('sha256')
                     or e['filename'] not in assets]
          if missing:
              raise SystemExit('manifest assets missing or unverified: ' + repr(missing))
          PY

      - name: Refresh stable Wizard install link
        if: steps.detect.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ -f dist/plugin.program.kodipovilwizard-latest.zip ]; then
            gh release upload "$RELEASE_TAG" dist/plugin.program.kodipovilwizard-latest.zip --clobber
          fi

      - name: Commit manifest.json
        if: steps.detect.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged -- nothing to commit"
            exit 0
          fi
          git commit -m "chore(manifest): update addon manifest [skip ci]"
          BRANCH="${{ github.ref_name }}"
          # A concurrent source change requires a fresh build and review.
          git push origin "HEAD:${BRANCH}"

      # The release kept every version it had ever served (228 files before
      # they were cleared by hand, Nov 2026). After the new manifest is in
      # place, what neither it nor the manifest before it names is removed;
      # the script deletes nothing when anything looks wrong, and a failure
      # here never fails the build -- the packages are already published.
      - name: Remove superseded packages from the release
        if: steps.detect.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          python .github/scripts/prune_release_assets.py --manifest manifest.json \
            --previous "$RUNNER_TEMP/manifest.previous.json" \
            --assets "$RUNNER_TEMP/release-assets.txt" --delete
