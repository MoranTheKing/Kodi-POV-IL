name: Build Android, Windows and webOS packages

# Builds rebranded Kodi APKs (32-bit + 64-bit), a Windows installer and a
# metadata-preserving LG webOS IPK, then attaches them to a GitHub Release.
# Uses only system tools and
# `gh` (GitHub CLI, preinstalled on the runner) -- no `actions/*`
# imports -- so the repo's "MoranTheKing actions only" policy doesn't
# block it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag / version label (e.g., 21.3-povil.1)'
        required: true
        default: '21.3-povil.49'
      version_code:
        description: 'Android versionCode (integer, must increase each release)'
        required: true
        default: '2103049'
      kodi_version:
        description: 'Upstream Kodi version to rebrand (e.g., 21.3)'
        required: true
        default: '21.3'

permissions:
  contents: write
  pull-requests: write

env:
  # Separate applicationId so Kodi POV IL can live side-by-side with official
  # Kodi. This must stay the same length as OLD_PACKAGE_ID because we patch
  # Kodi's original DEX/native package strings in place and intentionally avoid
  # apktool's smali reassembly path, which crash-looped previous attempts.
  OLD_PACKAGE_ID: 'org.xbmc.kodi'
  PACKAGE_ID: 'org.xbmc.povi'
  APP_NAME: 'Kodi POV IL'
  WIZARD_VERSION: '0.1.48'
  # The full build this package hydrates from. It used to be the same
  # filename typed out three times below, and it went stale the moment a
  # release bumped the build: the unzip would fail on a name that no longer
  # existed, or -- worse on the two paths that pass it to a script -- quietly
  # ship the previous build inside a new package. One name, one place, and a
  # test that requires it to be the build wizard/assets/build.txt actually
  # serves, so it cannot drift from what devices download.
  BUILD_ZIP: 'Kodi-POV-IL-FENtastic-test-0.1.121.zip'
  EXPECTED_RELEASE: '21.3-povil.49'
  EXPECTED_VERSION_CODE: '2103049'
  EXPECTED_KODI_VERSION: '21.3'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release inputs
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          KODI_VERSION="${{ github.event.inputs.kodi_version }}"
          if [ "$VERSION" != "$EXPECTED_RELEASE" ] ||
             [ "$VERSION_CODE" != "$EXPECTED_VERSION_CODE" ] ||
             [ "$KODI_VERSION" != "$EXPECTED_KODI_VERSION" ]; then
            echo "::error::Release inputs must be ${EXPECTED_RELEASE}, versionCode ${EXPECTED_VERSION_CODE}, Kodi ${EXPECTED_KODI_VERSION}. Bump the guarded workflow constants intentionally for a future release."
            exit 1
          fi

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            aapt \
            zipalign \
            apksigner \
            nsis \
            python3-pil \
            unzip \
            curl \
            git
          # apktool 2.9.3 -- matches API 34
          sudo curl -fsSL -o /usr/local/bin/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          sudo curl -fsSL -o /usr/local/bin/apktool \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool

      - name: Clone main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=main \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            src

      - name: Generate shared platform branding
        run: |
          set -euo pipefail
          python3 src/.github/scripts/platform_branding.py generate \
            --logo src/.github/assets/ic_launcher_master.png \
            --splash src/wizard/assets/build_menu_screenshots/pov_il_splash.jpg \
            --out "$RUNNER_TEMP/platform-branding"
          test -s "$RUNNER_TEMP/platform-branding/povil.ico"
          test -s "$RUNNER_TEMP/platform-branding/android-tv-banner.png"
          test -s "$RUNNER_TEMP/platform-branding/applaunch_screen.png"

      - name: Decrypt release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set. See APK_BUILD.md for setup."
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          if [ ! -f src/.secrets/release.keystore.enc ]; then
            echo "::error::No .secrets/release.keystore.enc in repo. Run the setup-keystore workflow first."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in src/.secrets/release.keystore.enc \
            -out $HOME/release.keystore \
            -pass env:KEYSTORE_PASSWORD
          test -s $HOME/release.keystore

      - name: Build both Android APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_PASSWORD"
          KEY_ALIAS="kodipovil"
          VERSION="${{ github.event.inputs.version }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          KODI_VERSION="${{ github.event.inputs.kodi_version }}"
          mkdir -p out
          for arch in armeabi-v7a arm64-v8a; do
            case "$arch" in
              armeabi-v7a) MIRROR_DIR="arm";    LABEL="32bit" ;;
              arm64-v8a)   MIRROR_DIR="arm64-v8a"; LABEL="64bit" ;;
            esac
            WORK="$RUNNER_TEMP/build-$arch"
            mkdir -p "$WORK"
            echo "::group::Download official Kodi APK ($arch)"
            curl -fL --retry 3 -o "$WORK/kodi-official.apk" \
              "https://mirrors.kodi.tv/releases/android/${MIRROR_DIR}/kodi-${KODI_VERSION}-Omega-${arch}.apk"
            echo "::endgroup::"
            echo "::group::apktool decode (keep original dex; no smali rebuild)"
            apktool d -f -s -o "$WORK/decoded" "$WORK/kodi-official.apk"
            echo "::endgroup::"
            echo "::group::Update package id, label + version metadata"
            if [ "${#OLD_PACKAGE_ID}" -ne "${#PACKAGE_ID}" ]; then
              echo "::error::OLD_PACKAGE_ID and PACKAGE_ID must be the same length for binary patching"
              exit 1
            fi
            python3 src/.github/scripts/patch_apk_package_binary.py \
              "$WORK/decoded" "$OLD_PACKAGE_ID" "$PACKAGE_ID"
            # Apktool stores versionCode/versionName in apktool.yml and writes
            # those values back during build. Its decoded manifest intentionally
            # omits both attributes, so editing AndroidManifest.xml is a no-op.
            python3 src/.github/scripts/patch_apktool_metadata.py \
              "$WORK/decoded/apktool.yml" "$VERSION_CODE" "$VERSION"
            for f in "$WORK/decoded/res/values/strings.xml" "$WORK/decoded"/res/values-*/strings.xml; do
              [ -f "$f" ] || continue
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">'"$APP_NAME"'</string>|' "$f" || true
            done
            # Custom launcher icon. Kodi uses plain @drawable/ic_launcher PNGs
            # (no adaptive/mipmap), so we overwrite the 6 density variants with
            # our Kodi POV IL icon. This is independent of the package id.
            for dens in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              ICON_SRC="src/.github/assets/ic_launcher/ic_launcher-${dens}.png"
              ICON_DST="$WORK/decoded/res/drawable-${dens}/ic_launcher.png"
              if [ -f "$ICON_SRC" ] && [ -f "$ICON_DST" ]; then
                cp "$ICON_SRC" "$ICON_DST"
                echo "icon: replaced drawable-${dens}/ic_launcher.png"
              fi
            done
            # Android TV launchers may prefer the application banner over the
            # launcher icon. Kodi also carries upstream icons/splashes inside
            # assets/media, so replace and verify every user-visible variant.
            BRANDING="$RUNNER_TEMP/platform-branding"
            for target in \
              "$WORK/decoded/res/drawable-xhdpi/banner.png" \
              "$WORK/decoded/assets/media/banner.png" \
              "$WORK/decoded/assets/media/applaunch_screen.png" \
              "$WORK/decoded/assets/media/splash.jpg"; do
              test -f "$target" || {
                echo "::error::Upstream APK branding path is missing: $target"
                exit 1
              }
            done
            cp "$BRANDING/android-tv-banner.png" \
              "$WORK/decoded/res/drawable-xhdpi/banner.png"
            cp "$BRANDING/android-tv-banner.png" \
              "$WORK/decoded/assets/media/banner.png"
            cp "$BRANDING/applaunch_screen.png" \
              "$WORK/decoded/assets/media/applaunch_screen.png"
            cp "$BRANDING/source-splash.jpg" \
              "$WORK/decoded/assets/media/splash.jpg"
            for media_icon in \
              icon16x16.png icon32x32.png icon48x48.png icon80x80.png \
              icon120x120.png icon256x256.png vendor_icon.png; do
              test -f "$WORK/decoded/assets/media/$media_icon" || {
                echo "::error::Upstream APK media icon is missing: $media_icon"
                exit 1
              }
              cp "$BRANDING/media/$media_icon" \
                "$WORK/decoded/assets/media/$media_icon"
            done
            mkdir -p "$WORK/decoded/assets/system"
            printf '%s\n' "$VERSION" \
              > "$WORK/decoded/assets/system/povil-release.txt"
            echo "::endgroup::"
            echo "::group::Bundle wizard (+ its python deps) into assets/"
            # IMPORTANT: do NOT unpack the full build into assets/. The build
            # zip is created from a desktop Kodi profile and carries copies of
            # addons the official APK already ships as system addons (e.g.
            # inputstream.adaptive with a Windows-only addon.xml + .dll).
            # Overwriting those inside the APK breaks required system addons
            # and Kodi aborts startup -> black screen on launch. The wizard's
            # first-run hydration downloads and installs the full build into
            # the user profile instead, exactly like a clean-Kodi install.
            ASSETS="$WORK/decoded/assets"
            mkdir -p "$ASSETS/addons"
            ADDONS_TO_ENABLE=(
              "plugin.program.kodipovilwizard"
              "script.module.requests"
              "script.module.six"
              "script.module.certifi"
              "script.module.urllib3"
              "script.module.chardet"
              "script.module.idna"
            )
            # Refuse to overwrite anything Kodi ships in the APK itself; a
            # wrong-platform copy of a system addon black-screens the app.
            for addon_id in "${ADDONS_TO_ENABLE[@]}"; do
              if [ -d "$ASSETS/addons/$addon_id" ]; then
                echo "::error::$addon_id already ships inside the official APK; refusing to overwrite it"
                exit 1
              fi
            done
            unzip -o "src/dist/plugin.program.kodipovilwizard-${WIZARD_VERSION}.zip" -d "$ASSETS/addons/" >/dev/null
            # The wizard imports requests at startup; pull its pure-python
            # dependency stack (platform "all") out of the build zip.
            unzip -o "src/dist/${BUILD_ZIP}" \
              'addons/script.module.requests/*' \
              'addons/script.module.six/*' \
              'addons/script.module.certifi/*' \
              'addons/script.module.urllib3/*' \
              'addons/script.module.chardet/*' \
              'addons/script.module.idna/*' \
              -d "$ASSETS/" >/dev/null
            for addon_id in "${ADDONS_TO_ENABLE[@]}"; do
              test -f "$ASSETS/addons/$addon_id/addon.xml" || {
                echo "::error::$addon_id missing from APK assets after bundling"
                exit 1
              }
            done
            # Register the bundled addons as OPTIONAL system addons so Kodi
            # auto-enables them on first launch. optional="true" is critical:
            # a non-optional manifest entry that fails to load makes
            # CAddonMgr::Init() fail and Kodi exits before drawing anything
            # (the exact black-screen failure previous releases shipped).
            MANIFEST_FILE="$ASSETS/system/addon-manifest.xml"
            for addon_id in "${ADDONS_TO_ENABLE[@]}"; do
              if grep -qE "<addon[^>]*>$addon_id</addon>" "$MANIFEST_FILE"; then
                echo "already in manifest: $addon_id"
              else
                sed -i "s|</addons>|  <addon optional=\"true\">$addon_id</addon>\n</addons>|" "$MANIFEST_FILE"
                echo "added to manifest:   $addon_id"
              fi
            done
            echo "--- final manifest tail ---"
            tail -15 "$MANIFEST_FILE"
            # The bundled wizard/build are copied into assets after the first
            # package patch. Patch the decoded tree again so payload files such
            # as assets/addons/plugin.program.kodipovilwizard/uservar.py don't
            # reintroduce org.xbmc.kodi and make the final verifier fail.
            python3 src/.github/scripts/patch_apk_package_binary.py \
              "$WORK/decoded" "$OLD_PACKAGE_ID" "$PACKAGE_ID"
            echo "::endgroup::"
            echo "::group::apktool repack + zipalign + sign"
            apktool b -o "$WORK/unsigned.apk" "$WORK/decoded"
            python3 src/.github/scripts/verify_apk_package.py \
              "$WORK/unsigned.apk" \
              "${OLD_PACKAGE_ID//./\/}" \
              "${PACKAGE_ID//./\/}"
            zipalign -p -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"
            OUT_APK="out/Kodi-POV-IL-${VERSION}-${LABEL}.apk"
            apksigner sign \
              --ks $HOME/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEYSTORE_PASSWORD" \
              --out "$OUT_APK" \
              "$WORK/aligned.apk"
            apksigner verify --print-certs "$OUT_APK" | head -10
            python3 src/.github/scripts/verify_android_apk_metadata.py \
              --aapt aapt \
              --apk "$OUT_APK" \
              --package-id "$PACKAGE_ID" \
              --version-code "$VERSION_CODE" \
              --version-name "$VERSION" \
              --app-name "$APP_NAME" \
              --native-code "$arch"
            python3 src/.github/scripts/platform_branding.py verify-apk \
              --apk "$OUT_APK" \
              --launcher-dir src/.github/assets/ic_launcher \
              --generated-dir "$RUNNER_TEMP/platform-branding" \
              --release-label "$VERSION"
            echo "::endgroup::"
          done
          ls -la out/

      - name: Build LG webOS IPK
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          # webOS Kodi only has the 21.0 IPK published (no 21.x point
          # releases for webOS yet); hardcode the URL.
          WEBOS_IPK_URL="https://mirrors.kodi.tv/releases/webos/org.xbmc.kodi-webos_21.0.ipk"
          WORK="$RUNNER_TEMP/build-webos"
          mkdir -p "$WORK"
          echo "::group::Download official Kodi webOS IPK"
          curl -fL --retry 3 -o "$WORK/kodi-official.ipk" "$WEBOS_IPK_URL"
          echo "b8ac326df8ad7cf0b52e4f816ab7c39c95410254b1bc3b9b3d024035ecec58ff  $WORK/kodi-official.ipk" \
            | sha256sum -c -
          echo "::endgroup::"
          OUT_IPK="out/Kodi-POV-IL-${VERSION}-webos.ipk"
          echo "::group::Patch and independently verify webOS IPK"
          python3 src/.github/scripts/build_webos_ipk.py build \
            --official "$WORK/kodi-official.ipk" \
            --wizard "src/dist/plugin.program.kodipovilwizard-${WIZARD_VERSION}.zip" \
            --build-zip "src/dist/${BUILD_ZIP}" \
            --branding-dir "$RUNNER_TEMP/platform-branding" \
            --release-label "$VERSION" \
            --output "$OUT_IPK"
          ls -la "$OUT_IPK"
          echo "::endgroup::"

      - name: Build Windows installer
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          KODI_VERSION="${{ github.event.inputs.kodi_version }}"
          mkdir -p $RUNNER_TEMP/win
          curl -fL --retry 3 -o $RUNNER_TEMP/win/kodi-setup.exe \
            "https://mirrors.kodi.tv/releases/windows/win64/kodi-${KODI_VERSION}-Omega-x64.exe"
          cp "src/dist/plugin.program.kodipovilwizard-${WIZARD_VERSION}.zip" $RUNNER_TEMP/win/wizard.zip
          cp "src/dist/${BUILD_ZIP}" $RUNNER_TEMP/win/build.zip
          cp src/dist/installer/build-windows-installer.nsi     $RUNNER_TEMP/win/installer.nsi
          cp "$RUNNER_TEMP/platform-branding/povil.ico"          $RUNNER_TEMP/win/povil.ico
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)-povil\.([0-9]+)$ ]]; then
            FILE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          else
            echo "::error::Invalid release label: $VERSION"
            exit 1
          fi
          (cd $RUNNER_TEMP/win && \
            makensis -V2 -DVERSION="$VERSION" -DFILE_VERSION="$FILE_VERSION" installer.nsi)
          cp $RUNNER_TEMP/win/Kodi-POV-IL-Setup-*.exe out/
          ls -la out/

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          # Delete the release if it already exists (gh CLI is preinstalled)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          NOTES=$(printf '%s\n%s\n%s\n%s\n%s' \
            "Built automatically by .github/workflows/build-apk.yml." \
            "Android APK: stable package id '${PACKAGE_ID}', complete POV IL launcher/TV branding, and the wizard pre-bundled in assets/." \
            "Windows installer: preserves an existing portable_data profile, repairs standard-user access, and creates branded -p shortcuts without launching Kodi elevated." \
            "LG webOS IPK: keeps app id org.xbmc.kodi for in-place updates, uses a valid numeric package version, preserves upstream archive metadata, and bundles the same wizard." \
            "Fresh installs share the same first-launch flow: the wizard downloads and installs Kodi POV IL - FENtastic, then closes Kodi; reopen it to finish.")
          # Also keep stable filenames (no version) so download pages
          # can use the /latest/download/ redirect without rewriting.
          cp "../out/Kodi-POV-IL-${VERSION}-32bit.apk" "../out/Kodi-POV-IL-32bit.apk"
          cp "../out/Kodi-POV-IL-${VERSION}-64bit.apk" "../out/Kodi-POV-IL-64bit.apk"
          cp "../out/Kodi-POV-IL-Setup-${VERSION}.exe" "../out/Kodi-POV-IL-Setup.exe"
          cp "../out/Kodi-POV-IL-${VERSION}-webos.ipk" "../out/Kodi-POV-IL-webos.ipk"
          gh release create "$TAG" \
            --title "Kodi POV IL ${VERSION}" \
            --notes "$NOTES" \
            ../out/Kodi-POV-IL-${VERSION}-32bit.apk \
            ../out/Kodi-POV-IL-${VERSION}-64bit.apk \
            ../out/Kodi-POV-IL-Setup-${VERSION}.exe \
            ../out/Kodi-POV-IL-${VERSION}-webos.ipk \
            ../out/Kodi-POV-IL-webos.ipk \
            ../out/Kodi-POV-IL-32bit.apk \
            ../out/Kodi-POV-IL-64bit.apk \
            ../out/Kodi-POV-IL-Setup.exe

      - name: Update version pointer files on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          mkdir -p wizard/assets/kodi_version_auto_update/apk wizard/assets/kodi_version_auto_update/windows
          echo "$VERSION" > wizard/assets/kodi_version_auto_update/apk/latest_apk_version.txt
          echo "$VERSION" > wizard/assets/kodi_version_auto_update/windows/latest_windows_version.txt
          # Commit only if there's actually a change.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add wizard/assets/kodi_version_auto_update/
          if git diff --cached --quiet; then
            echo "Version pointer files already up to date."
            exit 0
          fi
          # Branch protection on main blocks direct push, so open a PR
          # the user can merge with one click.
          BRANCH="bot/apk-release-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "Publish APK ${VERSION} pointer files"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Publish APK ${VERSION} pointer files" \
            --body "Auto-generated by build-apk workflow run ${{ github.run_id }}. Bumps the wizard's latest_apk_version.txt and latest_windows_version.txt to ${VERSION}, so installed Kodi POV IL clients notice the new release."
