name: Deploy GitHub Pages

# Sync main into gh-pages so GitHub Pages serves the latest commit
# from main. Uses only git + the workflow's automatic GITHUB_TOKEN --
# no third-party actions (so the repo's "MoranTheKing actions only"
# policy can stay locked down).
#
# Strategy: fetch the existing gh-pages branch, replace its tree with
# whatever's currently on main, commit, and regular-push. This way
# the gh-pages branch keeps a linear history -- no force push needed,
# so the "Disable force pushes" branch protection rule stays satisfied.
#
# Requires GitHub Pages settings:
#   Source = "Deploy from a branch", Branch = "gh-pages", Folder = "/".

# ...AND ON A PUBLISHED RELEASE. The step below republishes the latest
# release's APKs into downloads/, but this workflow only ever woke on a push
# to main -- and build-apk.yml does NOT push to main when it rebuilds an
# existing version, because its pointer-file step sees the version is already
# recorded and exits without a commit. So on 2026-08-23 the packages were
# rebuilt at 02:49 carrying build 0.1.119, landed on the GitHub Release, and
# the download page went on serving the previous APKs with nothing scheduled
# to ever replace them. Anyone installing from the site would have got the old
# build, silently, until the next unrelated push happened along.
on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync-main-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main tree to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git"
          # Blobless + no-checkout clone of gh-pages: we replace its whole tree
          # anyway, so we must NOT download its (possibly multi-GB) existing
          # blobs -- that is what filled the runner disk ("No space left on
          # device"). This pulls only the branch ref/history so we can extend
          # it (no force push -> branch protection stays satisfied).
          git clone --depth=1 --single-branch --branch=gh-pages \
            --filter=blob:none --no-checkout "$REMOTE" gh
          cd gh
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cd ..
          # Blobless clone of main; we only pull the blobs we actually publish.
          git clone --depth=1 --single-branch --branch=main \
            --filter=blob:none "$REMOTE" src
          # Publish main's tree EXCEPT:
          #   dist/    -- the build/quickfix binaries (many GB) are fetched from
          #               raw.githubusercontent.com/<repo>/main/dist/, NOT from
          #               Pages, so they must never be copied to gh-pages.
          #   .github/  -- GITHUB_TOKEN cannot push workflow files.
          #   .secrets/ -- the (encrypted) signing keystore; never publish it.
          # Everything Pages actually serves (repo/ addon channel, wizard/,
          # index.html, install.html, ...) is kept.
          cd src
          PUBLISH_PATHS="$(git ls-tree --name-only HEAD | grep -vxE 'dist|\.github|\.secrets')"
          # shellcheck disable=SC2086
          git archive HEAD -- $PUBLISH_PATHS | tar -x -C ../gh
          cd ..
          # Publish the latest release APKs as DIRECT files under downloads/ so
          # the Downloader app (and any browser) can fetch them in a single 200
          # response. GitHub Releases' redirect chain breaks Downloader, and an
          # AFTVnews code that points at the /downloads/ HTML page just hands
          # Downloader an unusable web page. These live on gh-pages ONLY (never
          # committed to main), so the source repo isn't bloated with binaries;
          # identical bytes across deploys produce no new commit.
          mkdir -p gh/downloads
          gh release download --repo "$REPO_SLUG" \
            --pattern "Kodi-POV-IL-64bit.apk" \
            --pattern "Kodi-POV-IL-32bit.apk" \
            --dir gh/downloads --clobber \
            || echo "No release APK assets yet; skipping APK publish."
          touch gh/.nojekyll
          cd gh
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish; gh-pages already matches main."
            exit 0
          fi
          SHORT_SHA="$(echo "$PUSHED_SHA" | cut -c1-7)"
          git commit -q -m "Publish main@${SHORT_SHA}"
          git push "$REMOTE" gh-pages
