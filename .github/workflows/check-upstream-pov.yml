name: Check upstream add-ons

# Runs every 6 hours. POV, Idan Plus, Arctic Fuse 3, Umbrella, Otaku and
# Account Manager update themselves on users' devices straight from their
# developers' repositories, and the build patches several of them. When a
# repository publishes a version newer than the one recorded in
# UPSTREAM_VERSIONS.txt, open a tracking issue so the patchers are re-run
# against it. Uses only the runner's own git, python3 and gh, so the repo's
# "owner-authored Actions only" policy does not block the run.
#
# This replaced a watch on kodi7rd's build.txt, which went offline and left
# the old check skipping every run in silence.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # A legacy device moves to the modular build only onto the official POV the
  # migration pin names, and the Wizard never downgrades POV. Kodi updates POV
  # by itself about once a week, so a pin left behind strands every device not
  # yet migrated (field log 16 Oct 2026). Move the pin -- only after the Wizard
  # patch engine is proven on the new official POV -- and publish it at once.
  #
  # Detection takes no lock: joining the release concurrency group on every
  # run would cancel a release that is waiting in it.
  pov-pin-detect:
    if: github.repository == 'MoranTheKing/Kodi-POV-IL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - name: Is upstream POV newer than the migration pin?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Queueing into the release concurrency group cancels a release
          # already waiting there, and a newer POV whose anchors need a human
          # keeps this "newer" for days. Never queue while a release is busy.
          BUSY=$(gh run list --repo "$REPO_SLUG" --workflow build-and-release.yml \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "A release run is queued or running; not entering its group now."
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo
          cd repo
          git sparse-checkout set --no-cone /tools/auto_bump_pov_pin.py \
            /tools/check_upstream_addons.py /.github/pov-host-migration.json
          OUT=$(python3 tools/auto_bump_pov_pin.py --check)
          echo "$OUT"
          case "$OUT" in
            newer*) echo "newer=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "newer=false" >> "$GITHUB_OUTPUT" ;;
          esac

  pov-pin:
    needs: pov-pin-detect
    if: needs.pov-pin-detect.outputs.newer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    # Shares the rolling release and manifest.json with the release workflow.
    concurrency:
      group: build-and-release
      cancel-in-progress: false
    steps:
      - name: Move the clean-host POV pin when a newer POV fits our patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A release that is still queued or running owns manifest.json and
          # main; leave this to the next run (every 6 hours).
          BUSY=$(gh run list --repo "$REPO_SLUG" --workflow build-and-release.yml \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "A release run is in progress; trying again on the next schedule."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" repo
          cd repo
          STATUS=0
          OUT=$(python3 tools/auto_bump_pov_pin.py "$RUNNER_TEMP/pov-pin") || STATUS=$?
          echo "$OUT"
          case "$OUT" in
            current*)
              exit 0 ;;
            unavailable*)
              # Usually a repository that has not finished publishing; retry later.
              exit 0 ;;
            blocked*)
              VER=${OUT#blocked }
              VER=${VER%%:*}
              TITLE="POV $VER: migration pin NOT moved (patches need attention)"
              if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
                   --json title --jq 'length' | grep -qv '^0$'; then
                echo "Issue already open."
              else
                gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE" --body "$OUT

          Devices still on legacy MoranSubs 0.2.x cannot migrate once Kodi installs this POV. Fix the moved anchors in patches_config.py; the next run moves the pin by itself."
              fi
              exit 0 ;;
            bumped*) ;;
            *)
              echo "unexpected output (exit $STATUS)" >&2
              exit 1 ;;
          esac
          read -r _ OLD NEW ZIP <<< "$OUT"
          NAME=$(basename "$ZIP")
          # gen_manifest.py treats dist/<id>-<version>.zip as freshly built;
          # the clone tracks old package zips there. Start empty, as the
          # release workflow does: every module and the config carry over
          # and only the pin moves.
          rm -rf dist
          mkdir dist
          python3 .github/scripts/gen_manifest.py
          mkdir -p "$RUNNER_TEMP/pov-verify"
          if ! gh release view addons-latest --repo "$REPO_SLUG" --json assets -q '.assets[].name' \
               | grep -Fxq "$NAME"; then
            gh release upload addons-latest --repo "$REPO_SLUG" "$ZIP"
          fi
          gh release download addons-latest --repo "$REPO_SLUG" -p "$NAME" -D "$RUNNER_TEMP/pov-verify"
          if ! cmp "$ZIP" "$RUNNER_TEMP/pov-verify/$NAME"; then
            echo "addons-latest already holds a different $NAME (re-published upstream?)" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pov-host-migration.json UPSTREAM_VERSIONS.txt manifest.json
          git commit -m "chore(pov): move the clean-host migration pin to POV $NEW [skip ci]"
          git push origin HEAD:main
          gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" \
            --title "POV $NEW: migration pin moved automatically ($OLD -> $NEW)" \
            --body "$OUT

          Verified automatically: the official zip is POV $NEW, and every enabled Wizard patch applies to it (nothing missing, idempotent). Legacy devices on POV $NEW can migrate again.

          NOT verified -- still to do by hand:
          - the MoranSubs POV host patchers (service.subtitles.kodipovilai/resources/lib/pov_*_patcher.py and others that edit POV);
          - runtime version gates such as pov_http_session._VERIFIED_VERSIONS (an unlisted POV silently runs without the deferred HTTP clients);
          - real Kodi QA on the new POV."

  check:
    needs: pov-pin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream repositories with the verified versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo
          cd repo
          git sparse-checkout set --no-cone /tools/check_upstream_addons.py /UPSTREAM_VERSIONS.txt
          CHANGES=$(python3 tools/check_upstream_addons.py UPSTREAM_VERSIONS.txt)
          if [ -z "$CHANGES" ]; then
            echo "All watched add-ons match UPSTREAM_VERSIONS.txt."
            exit 0
          fi
          echo "$CHANGES"

          TITLE="Upstream add-on update: $(printf '%s' "$CHANGES" | sed 's/: .* -> / /' | paste -sd ',' - | sed 's/,/, /g')"
          if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
               --json title --jq 'length' | grep -qv '^0$'; then
            echo "Issue \"$TITLE\" already open; skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "New upstream versions (verified -> published):" \
            "$CHANGES" \
            "Devices install these from the developers' repositories. Re-run the wizard patch engine and the MoranSubs host patchers against the new version, fix any moved anchor, then update UPSTREAM_VERSIONS.txt.")
          gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE" --body "$BODY"

  # A version compare cannot see a POV replaced under the same version (field
  # 20 Oct 2026: 6.10.06 republished with dialogs.py importing kodi_utils as
  # ku; one Wizard hook lost its anchor and fresh installs stopped at the end).
  # Compare the official zip of the pinned version with the pin, audit every
  # enabled Wizard patch on a changed one, and open one issue per new zip.
  pov-republish:
    if: github.repository == 'MoranTheKing/Kodi-POV-IL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Audit a POV republished under the pinned version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Sparse: the tracked tree is ~18 GB (dist/ zips); the audit needs
          # the patch engine, its config and the three scripts only.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo || { echo "clone failed; retry later"; exit 0; }
          cd repo
          git sparse-checkout set --no-cone /tools/auto_bump_pov_pin.py \
            /tools/check_upstream_addons.py /.github/pov-host-migration.json \
            /.github/scripts/verify_pov_patches.py /plugin.program.kodipovilwizard/ \
            || { echo "checkout failed; retry later"; exit 0; }
          STATUS=0
          OUT=$(python3 tools/auto_bump_pov_pin.py --republish-check) || STATUS=$?
          echo "$OUT"
          case "$OUT" in
            republished*) ;;
            *) exit 0 ;;   # same / newer (the pin job) / unavailable (retry later)
          esac
          VER=$(printf '%s' "$OUT" | cut -d' ' -f2)
          SHA=$(printf '%s' "$OUT" | cut -d' ' -f3)
          TITLE="POV $VER republished upstream (zip $SHA)"
          # Closed issues count too: one issue per republished zip, ever.
          if gh issue list --repo "$REPO_SLUG" --state all --search "in:title \"$TITLE\"" \
               --json title --jq 'length' | grep -qv '^0$'; then
            echo "Issue \"$TITLE\" already exists; skipping."
            exit 0
          fi
          if [ "$STATUS" = "0" ]; then
            VERDICT="Every enabled Wizard patch applies to the new zip (audit below). Fresh installs are fine; still check the MoranSubs POV host patchers and test in Kodi."
          else
            VERDICT="A Wizard patch does NOT fit the new zip: fresh installs will stop with \"Fresh source patches are incomplete\". Fix the anchor (an \"alternatives\" entry in patches_config.py) and release the Wizard."
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "The official plugin.video.pov $VER zip changed without a version bump (sha256 $SHA..., the migration pin still names the original)." \
            "$VERDICT" \
            "$OUT")
          gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE" --body "$BODY"
