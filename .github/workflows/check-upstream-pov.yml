name: Check upstream POV

# Runs every 6 hours to see if kodi7rd published a new POV build. If
# the version/URL in their build.txt differs from what we last
# recorded in UPSTREAM_POV.md, opens a tracking issue. Uses only curl
# + gh CLI so the repo's "MoranTheKing actions only" policy does not
# block the run.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream + diff against marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail

          UPSTREAM=$(curl -fsSL "https://kodi7rd.github.io/wizard/assets/build.txt")

          # Pull the POV section: everything from its name= line until the
          # next blank-line/name= boundary, then extract version + url.
          POV_BLOCK=$(printf '%s\n' "$UPSTREAM" | awk '
            BEGIN { inblock=0 }
            /name="Kodi Real Debrid Israel - POV"/ { inblock=1 }
            inblock { print }
            inblock && /^[[:space:]]*$/ { exit }
          ')
          VERSION=$(printf '%s\n' "$POV_BLOCK" | sed -n 's/^version="\([^"]*\)".*/\1/p' | head -1)
          URL=$(printf '%s\n' "$POV_BLOCK" | sed -n 's/^url="\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$VERSION" ] || [ -z "$URL" ]; then
            echo "::error::Could not parse upstream POV version/url from build.txt"
            printf '%s\n' "$UPSTREAM" | head -40
            exit 1
          fi
          echo "Upstream: version=$VERSION url=$URL"

          # Read the marker from main without cloning the whole repo.
          MARKER=$(curl -fsSL \
            "https://raw.githubusercontent.com/${REPO_SLUG}/main/UPSTREAM_POV.md" || echo "")
          if echo "$MARKER" | grep -q "version: ${VERSION}" && \
             echo "$MARKER" | grep -q "url: ${URL}"; then
            echo "Upstream POV unchanged at ${VERSION}; nothing to do."
            exit 0
          fi

          TITLE="Upstream POV changed to ${VERSION}"
          # Skip if an open issue with this title already exists.
          if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
               --json title --jq 'length' | grep -qv '^0$'; then
            echo "Issue \"$TITLE\" already open; skipping."
            exit 0
          fi

          BODY=$(printf '%s\n\n%s\n%s\n\n%s' \
            "A new upstream POV build appears to be available." \
            "version: ${VERSION}" \
            "url: ${URL}" \
            "Next step: rebuild Kodi POV IL FENtastic from the new upstream POV package, test on Android, then bump wizard/assets/build.txt.")
          gh issue create --repo "$REPO_SLUG" --title "$TITLE" --body "$BODY"
