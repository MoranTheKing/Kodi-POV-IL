name: Check upstream add-ons

# Runs every 6 hours. POV, Idan Plus, Arctic Fuse 3, Umbrella, Otaku and
# Account Manager update themselves on users' devices straight from their
# developers' repositories, and the build patches several of them. When a
# repository publishes a version newer than the one recorded in
# UPSTREAM_VERSIONS.txt, open a tracking issue so the patchers are re-run
# against it. Uses only the runner's own git, python3 and gh, so the repo's
# "owner-authored Actions only" policy does not block the run.
#
# This replaced a watch on kodi7rd's build.txt, which went offline and left
# the old check skipping every run in silence.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # A legacy device moves to the modular build only onto the official POV the
  # migration pin names, and the Wizard never downgrades POV. Kodi updates POV
  # by itself about once a week, so a pin left behind strands every device not
  # yet migrated (field log 16 Oct 2026). Move the pin -- only after the Wizard
  # patch engine is proven on the new official POV -- and publish it at once.
  #
  # Umbrella (kids-profile hooks) has the same kind of pin since Wizard
  # 0.4.69: the Wizard holds Kodi's auto-update for it and installs only the
  # pinned version, so its pin moves here too, on the same proof.
  #
  # Detection takes no lock: joining the release concurrency group on every
  # run would cancel a release that is waiting in it.
  pov-pin-detect:
    if: github.repository == 'MoranTheKing/Kodi-POV-IL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.check.outputs.targets }}
    steps:
      - name: Is upstream POV or Umbrella newer than its pin?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Queueing into the release concurrency group cancels a release
          # already waiting there, and a newer POV whose anchors need a human
          # keeps this "newer" for days. Never queue while a release is busy.
          BUSY=$(gh run list --repo "$REPO_SLUG" --workflow build-and-release.yml \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "A release run is queued or running; not entering its group now."
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo
          cd repo
          git sparse-checkout set --no-cone /tools/auto_bump_pov_pin.py \
            /tools/check_upstream_addons.py /.github/pov-host-migration.json \
            /.github/umbrella-pin.json
          TARGETS=""
          for ADDON in pov umbrella; do
            OUT=$(python3 tools/auto_bump_pov_pin.py --addon "$ADDON" --check) || OUT="error"
            echo "$ADDON: $OUT"
            case "$OUT" in
              newer*) TARGETS="$TARGETS${TARGETS:+,}\"$ADDON\"" ;;
            esac
          done
          echo "targets=[$TARGETS]" >> "$GITHUB_OUTPUT"

  pov-pin:
    needs: pov-pin-detect
    if: needs.pov-pin-detect.outputs.targets != '[]' && needs.pov-pin-detect.outputs.targets != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    # Shares the rolling release and manifest.json with the release workflow.
    concurrency:
      group: build-and-release
      cancel-in-progress: false
    steps:
      - name: Move each pin whose newer upstream version fits our patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          TARGETS: ${{ join(fromJSON(needs.pov-pin-detect.outputs.targets), ' ') }}
        run: |
          set -euo pipefail
          # A release that is still queued or running owns manifest.json and
          # main; leave this to the next run (every 6 hours).
          BUSY=$(gh run list --repo "$REPO_SLUG" --workflow build-and-release.yml \
                   --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$BUSY" != "0" ]; then
            echo "A release run is in progress; trying again on the next schedule."
            exit 0
          fi
          # One job for every pin: each job joining the release group on its
          # own would cancel a release queued in between. Each add-on runs in
          # its own subshell ("exit" ends only that add-on), on a fresh clone,
          # so the second one builds on the first one's push.
          FAILED=0
          for ADDON in $TARGETS; do
          set +e
          (
          set -euo pipefail
            if [ "$ADDON" = "umbrella" ]; then
              LABEL=Umbrella; PIN=.github/umbrella-pin.json
            else
              LABEL=POV; PIN=.github/pov-host-migration.json
            fi
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" "repo-$ADDON"
            cd "repo-$ADDON"
            STATUS=0
            OUT=$(python3 tools/auto_bump_pov_pin.py --addon "$ADDON" "$RUNNER_TEMP/pov-pin") || STATUS=$?
            echo "$OUT"
            case "$OUT" in
              current*)
                exit 0 ;;
              unavailable*)
                # Usually a repository that has not finished publishing; retry later.
                exit 0 ;;
              blocked*)
                VER=${OUT#blocked }
                VER=${VER%%:*}
                if [ "$ADDON" = "umbrella" ]; then
                  TITLE="Umbrella $VER: verified pin NOT moved (patches need attention)"
                  WHY="Devices stay on the pinned Umbrella (the Wizard holds its auto-update) until the pin moves."
                else
                  TITLE="POV $VER: migration pin NOT moved (patches need attention)"
                  WHY="Devices stay on the pinned POV (the Wizard holds its auto-update); a POV updated by hand blocks a legacy MoranSubs 0.2.x device's migration."
                fi
                if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
                     --json title --jq 'length' | grep -qv '^0$'; then
                  echo "Issue already open."
                else
                  gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE" --body "$OUT

            $WHY Fix the moved anchors in patches_config.py -- or, when the reason names the shared-HTTP proxy, adapt pov_http_session.py or the caller audit in .github/scripts/verify_pov_patches.py; when it names MoranSubs Umbrella patchers, fix them in service.subtitles.kodipovilai and release MoranSubs; the next run moves the pin by itself."
                fi
                exit 0 ;;
              bumped*) ;;
              *)
                echo "unexpected output (exit $STATUS)" >&2
                exit 1 ;;
            esac
            read -r _ OLD NEW ZIP <<< "$OUT"
            NAME=$(basename "$ZIP")
            if [ "$ADDON" = "pov" ]; then
              # MoranSubs edits POV's files too: its patchers must fit the
              # official zip before the pin moves (Umbrella's are checked
              # inside the pin script).
              rm -rf "$RUNNER_TEMP/pov-moransubs"
              mkdir -p "$RUNNER_TEMP/pov-moransubs"
              python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])'                 "$ZIP" "$RUNNER_TEMP/pov-moransubs"
              AUDIT=$(python3 -I .github/scripts/moransubs_host_audit.py service.subtitles.kodipovilai                         plugin.video.pov "$RUNNER_TEMP/pov-moransubs/plugin.video.pov" | tail -n 1)
              echo "$AUDIT"
              if ! printf '%s' "$AUDIT" | python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin)["ok"] else 1)'; then
                TITLE="POV $NEW: migration pin NOT moved (patches need attention)"
                if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\""                      --json title --jq 'length' | grep -qv '^0$'; then
                  echo "Issue already open."
                else
                  gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE"                     --body "The Wizard's hooks fit the official POV $NEW, but MoranSubs' own POV patchers do not: $AUDIT Fix the patcher named there (service.subtitles.kodipovilai/resources/lib), release MoranSubs, and the pin moves on the next run."
                fi
                exit 0
              fi
            fi
            # gen_manifest.py treats dist/<id>-<version>.zip as freshly built;
            # the clone tracks old package zips there. Start empty, as the
            # release workflow does: every module and the config carry over
            # and only the pin moves.
            rm -rf dist
            mkdir dist
            python3 .github/scripts/gen_manifest.py
            mkdir -p "$RUNNER_TEMP/pov-verify"
            if ! gh release view addons-latest --repo "$REPO_SLUG" --json assets -q '.assets[].name' \
                 | grep -Fxq "$NAME"; then
              gh release upload addons-latest --repo "$REPO_SLUG" "$ZIP"
            fi
            gh release download addons-latest --repo "$REPO_SLUG" -p "$NAME" -D "$RUNNER_TEMP/pov-verify"
            if ! cmp "$ZIP" "$RUNNER_TEMP/pov-verify/$NAME"; then
              echo "addons-latest already holds a different $NAME (re-published upstream?)" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PIN" UPSTREAM_VERSIONS.txt manifest.json
            git commit -m "chore($ADDON): move the verified $LABEL pin to $NEW [skip ci]"
            git push origin HEAD:main
            # The pin moved on proof -- the Wizard's hooks and MoranSubs' own
            # patchers fit the official zip -- so nobody has anything to do
            # and no issue is opened. An open "NOT moved" issue of this add-on
            # is answered by the move.
            echo "$LABEL pin moved: $OLD -> $NEW"
            for NUMBER in $(gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"NOT moved\""                               --json number,title --jq ".[] | select(.title | startswith(\"$LABEL \")) | .number"); do
              gh issue close "$NUMBER" --repo "$REPO_SLUG"                 --comment "The pin moved to $LABEL $NEW (verified automatically); closing."
            done
          )
          RC=$?
          set -e
          [ "$RC" = "0" ] || FAILED=1
          done
          exit $FAILED

  # Arctic Fuse 3, Idan Plus and Account Manager update themselves on devices.
  # Run the build's patches on the newest published version of each: one issue
  # per add-on stays open only while something does not fit, and is closed
  # here when it fits again. Until 17 Nov 2026 every new version opened an
  # issue that asked a person to re-run the patchers; nothing ran them.
  check:
    needs: pov-pin
    if: always() && github.repository == 'MoranTheKing/Kodi-POV-IL'
    runs-on: ubuntu-latest
    steps:
      - name: Run the build's patches on the newest upstream versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo
          cd repo
          git sparse-checkout set --no-cone /tools/check_upstream_addons.py \
            /.github/scripts/upstream_audit.py /.github/scripts/moransubs_host_audit.py \
            /plugin.program.kodipovilwizard/ /service.subtitles.kodipovilai/
          python3 .github/scripts/upstream_audit.py --issues "$REPO_SLUG" "${{ github.repository_owner }}"

  # A version compare cannot see a POV replaced under the same version (field
  # 20 Oct 2026: 6.10.06 republished with dialogs.py importing kodi_utils as
  # ku; one Wizard hook lost its anchor and fresh installs stopped at the end).
  # Compare the official zip of the pinned version with the pin, audit every
  # enabled Wizard patch on a changed one, and open one issue per new zip.
  pov-republish:
    if: github.repository == 'MoranTheKing/Kodi-POV-IL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        addon: [pov, umbrella]
    steps:
      - name: Audit a ${{ matrix.addon }} zip republished under the pinned version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          ADDON: ${{ matrix.addon }}
        run: |
          set -euo pipefail
          # Sparse: the tracked tree is ~18 GB (dist/ zips); the audit needs
          # the patch engine, its config and the three scripts only.
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo || { echo "clone failed; retry later"; exit 0; }
          cd repo
          git sparse-checkout set --no-cone /tools/auto_bump_pov_pin.py \
            /tools/check_upstream_addons.py /.github/pov-host-migration.json \
            /.github/umbrella-pin.json /.github/scripts/moransubs_umbrella_audit.py \
            /.github/scripts/verify_pov_patches.py /plugin.program.kodipovilwizard/ \
            /service.subtitles.kodipovilai/ \
            || { echo "checkout failed; retry later"; exit 0; }
          STATUS=0
          OUT=$(python3 tools/auto_bump_pov_pin.py --addon "$ADDON" --republish-check) || STATUS=$?
          echo "$OUT"
          case "$OUT" in
            republished*) ;;
            *) exit 0 ;;   # same / newer (the pin job) / unavailable (retry later)
          esac
          VER=$(printf '%s' "$OUT" | cut -d' ' -f2)
          SHA=$(printf '%s' "$OUT" | cut -d' ' -f3)
          if [ "$ADDON" = "umbrella" ]; then LABEL=Umbrella; else LABEL=POV; fi
          TITLE="$LABEL $VER republished upstream (zip $SHA)"
          # Closed issues count too: one issue per republished zip, ever.
          if gh issue list --repo "$REPO_SLUG" --state all --search "in:title \"$TITLE\"" \
               --json title --jq 'length' | grep -qv '^0$'; then
            echo "Issue \"$TITLE\" already exists; skipping."
            exit 0
          fi
          if [ "$ADDON" = "umbrella" ]; then
            # Devices install the mirrored copy the pin names, never this zip;
            # only a new pin (or a hand install) would bring it.
            if [ "$STATUS" = "0" ]; then
              VERDICT="Every enabled Wizard patch and every MoranSubs Umbrella patcher applies to the new zip (audit below). Devices keep the mirrored, verified copy."
            else
              VERDICT="The new zip does NOT pass the audit (reason below: a Wizard hook -> an \"alternatives\" entry in patches_config.py; MoranSubs Umbrella patchers -> fix and release MoranSubs). Devices keep the mirrored, verified copy."
            fi
          elif [ "$STATUS" = "0" ]; then
            VERDICT="Every enabled Wizard patch applies to the new zip (audit below). Fresh installs are fine; still check the MoranSubs POV host patchers and test in Kodi."
          else
            VERDICT="A Wizard patch does NOT fit the new zip: fresh installs will stop with \"Fresh source patches are incomplete\". Fix the anchor (an \"alternatives\" entry in patches_config.py) and release the Wizard."
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "The official plugin.video.$ADDON $VER zip changed without a version bump (sha256 $SHA..., the pin still names the original)." \
            "$VERDICT" \
            "$OUT")
          gh issue create --repo "$REPO_SLUG" --assignee "${{ github.repository_owner }}" --title "$TITLE" --body "$BODY"
