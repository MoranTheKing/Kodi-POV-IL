name: Check upstream add-ons

# Runs every 6 hours. POV, Idan Plus, Arctic Fuse 3, Umbrella, Otaku and
# Account Manager update themselves on users' devices straight from their
# developers' repositories, and the build patches several of them. When a
# repository publishes a version newer than the one recorded in
# UPSTREAM_VERSIONS.txt, open a tracking issue so the patchers are re-run
# against it. Uses only the runner's own git, python3 and gh, so the repo's
# "owner-authored Actions only" policy does not block the run.
#
# This replaced a watch on kodi7rd's build.txt, which went offline and left
# the old check skipping every run in silence.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # A legacy device moves to the modular build only onto the official POV the
  # migration pin names, and the Wizard never downgrades POV. Kodi updates POV
  # by itself about once a week, so a pin left behind strands every device not
  # yet migrated (field log 16 Oct 2026). Move the pin -- only after the Wizard
  # patch engine is proven on the new official POV -- and publish it at once.
  pov-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # Shares the rolling release and manifest.json with the release workflow.
    concurrency:
      group: build-and-release
      cancel-in-progress: false
    steps:
      - name: Move the clean-host POV pin when a newer POV fits our patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" repo
          cd repo
          STATUS=0
          OUT=$(python3 tools/auto_bump_pov_pin.py "$RUNNER_TEMP/pov-pin") || STATUS=$?
          echo "$OUT"
          case "$OUT" in
            current*)
              exit 0 ;;
            blocked*)
              VER=${OUT#blocked }
              VER=${VER%%:*}
              TITLE="POV $VER: migration pin NOT moved (patches need attention)"
              if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
                   --json title --jq 'length' | grep -qv '^0$'; then
                echo "Issue already open."
              else
                gh issue create --repo "$REPO_SLUG" --title "$TITLE" --body "$OUT

          Devices still on legacy MoranSubs 0.2.x cannot migrate once Kodi installs this POV. Fix the moved anchors in patches_config.py; the next run moves the pin by itself."
              fi
              exit 0 ;;
            bumped*) ;;
            *)
              echo "unexpected output (exit $STATUS)" >&2
              exit 1 ;;
          esac
          read -r _ OLD NEW ZIP <<< "$OUT"
          NAME=$(basename "$ZIP")
          # The manifest keeps every module and config as published and moves
          # only the pin (dist/ is empty here).
          python3 .github/scripts/gen_manifest.py
          mkdir -p "$RUNNER_TEMP/pov-verify"
          if ! gh release view addons-latest --repo "$REPO_SLUG" --json assets -q '.assets[].name' \
               | grep -Fxq "$NAME"; then
            gh release upload addons-latest --repo "$REPO_SLUG" "$ZIP"
          fi
          gh release download addons-latest --repo "$REPO_SLUG" -p "$NAME" -D "$RUNNER_TEMP/pov-verify"
          cmp "$ZIP" "$RUNNER_TEMP/pov-verify/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pov-host-migration.json UPSTREAM_VERSIONS.txt manifest.json
          git commit -m "chore(pov): move the clean-host migration pin to POV $NEW [skip ci]"
          git push origin HEAD:main
          gh issue create --repo "$REPO_SLUG" \
            --title "POV $NEW: migration pin moved automatically ($OLD -> $NEW)" \
            --body "$OUT

          The Wizard patch engine was verified on the official zip (every enabled patch applied, nothing missing, idempotent). Legacy devices on POV $NEW can migrate again. Close this issue after a look."

  check:
    needs: pov-pin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream repositories with the verified versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${REPO_SLUG}.git" repo
          cd repo
          git sparse-checkout set --no-cone /tools/check_upstream_addons.py /UPSTREAM_VERSIONS.txt
          CHANGES=$(python3 tools/check_upstream_addons.py UPSTREAM_VERSIONS.txt)
          if [ -z "$CHANGES" ]; then
            echo "All watched add-ons match UPSTREAM_VERSIONS.txt."
            exit 0
          fi
          echo "$CHANGES"

          TITLE="Upstream add-on update: $(printf '%s' "$CHANGES" | sed 's/: .* -> / /' | paste -sd ',' - | sed 's/,/, /g')"
          if gh issue list --repo "$REPO_SLUG" --state open --search "in:title \"$TITLE\"" \
               --json title --jq 'length' | grep -qv '^0$'; then
            echo "Issue \"$TITLE\" already open; skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "New upstream versions (verified -> published):" \
            "$CHANGES" \
            "Devices install these from the developers' repositories. Re-run the wizard patch engine and the MoranSubs host patchers against the new version, fix any moved anchor, then update UPSTREAM_VERSIONS.txt.")
          gh issue create --repo "$REPO_SLUG" --title "$TITLE" --body "$BODY"
