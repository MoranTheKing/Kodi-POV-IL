name: Modular preview checks (no release)

on:
  pull_request:
    paths:
      - "addons/service.subtitles.kodipovilai/**"
      - "wizard/source/plugin.program.kodipovilwizard/**"
      - "tools/build_modular_preview.py"
      - "tools/test_local_addon_imports.py"
      - "tools/test_modular_route_parity.py"
      - "tools/test_modular_service_entrypoints.py"
      - "tools/test_build_config_migration.py"
      - "tools/test_build_favourites_migration.py"
      - "tools/test_modular_host_migration.py"
      - "tools/audit_modular_host_migration.py"
      - ".github/workflows/modular-preview-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and prepare Python
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          command -v python3
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$(command -v python3)" "$RUNNER_TEMP/bin/python"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate active source and settings migration
        run: |
          python tools/test_local_addon_imports.py
          python tools/test_modular_route_parity.py
          python tools/test_modular_service_entrypoints.py
          python tools/test_build_config_migration.py
          python tools/test_build_favourites_migration.py
          python tools/test_modular_host_migration.py
          python tools/test_no_duplicate_definitions.py
          python tools/test_patcher_health.py
      - name: Build and inspect local-only modular preview
        run: |
          python tools/build_modular_preview.py --output "$RUNNER_TEMP/modular-preview"
          archive=$(find "$RUNNER_TEMP/modular-preview" -maxdepth 1 -name 'service.subtitles.kodipovilai-*.zip' -print -quit)
          test -n "$archive"
          python tools/test_local_addon_imports.py --zip "$archive"
          python tools/test_modular_route_parity.py --zip "$archive"
          python tools/test_modular_service_entrypoints.py --zip "$archive"
